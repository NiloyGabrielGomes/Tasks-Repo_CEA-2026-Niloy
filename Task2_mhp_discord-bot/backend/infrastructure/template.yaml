# AWS SAM Template for MHP Discord Bot
# Serverless Application Model - Infrastructure as Code

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Meal Headcount Planner Discord Bot - Serverless Infrastructure

# Parameters
Parameters:
  DiscordPublicKey:
    Type: String
    NoEcho: true
    Description: Discord application public key for signature verification

  DiscordApplicationId:
    Type: String
    Description: Discord application ID

  DiscordBotToken:
    Type: String
    NoEcho: true
    Description: Discord bot token

  DiscordGuildId:
    Type: String
    Description: Discord server/guild ID

  DynamoDBTableName:
    Type: String
    Description: Name of the existing DynamoDB table

  S3BucketName:
    Type: String
    Description: Name of the existing S3 bucket

  EnableGoogleChat:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Feature flag to enable Google Chat integration

  GoogleChatAudience:
    Type: String
    Default: ""
    Description: JWT audience for Google Chat verification — set to your API Gateway endpoint URL (e.g. https://xxx.execute-api.ap-south-1.amazonaws.com/prod/google-chat)

  RoleAdminId:
    Type: String
    Default: ""
    Description: Discord role ID for MHP-Admin (right-click role in Discord → Copy Role ID)

  RoleTeamLeadId:
    Type: String
    Default: ""
    Description: Discord role ID for MHP-TeamLead (right-click role in Discord → Copy Role ID)

  GoogleChatServiceAccountJson:
    Type: String
    NoEcho: true
    Default: ""
    Description: Base64-encoded GCP service account JSON key for posting messages via Chat REST API

# Globals
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref SharedDepsLayer
    Environment:
      Variables:
        DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
        DISCORD_APPLICATION_ID: !Ref DiscordApplicationId
        DISCORD_BOT_TOKEN: !Ref DiscordBotToken
        DISCORD_GUILD_ID: !Ref DiscordGuildId
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
        S3_BUCKET: !Ref S3BucketName
        CUTOFF_TIME: "21:00"
        WFH_MONTHLY_CAP: "5"
        FORWARD_PLANNING_DAYS: "7"
        TIMEZONE: "Asia/Dhaka"
        # Multi-Lambda dispatch (Issue #19) — set to "true" to enable
        ENABLE_MULTI_LAMBDA: "true"
        MEAL_FUNCTION_NAME: trainee-2026-niloy-mhp-meal
        LOCATION_FUNCTION_NAME: trainee-2026-niloy-mhp-location
        OVERRIDE_FUNCTION_NAME: trainee-2026-niloy-mhp-override
        HEADCOUNT_FUNCTION_NAME: trainee-2026-niloy-mhp-headcount
        # Google Chat integration (Issue #18) — set ENABLE_GOOGLE_CHAT to "true" to enable
        ENABLE_GOOGLE_CHAT: !Ref EnableGoogleChat
        GOOGLE_CHAT_AUDIENCE: !Ref GoogleChatAudience

# Resources
Resources:
  # ── Shared Lambda Layer ───────────────────────────────────────────────────────
  # All pip packages live here. Functions bundle only Python source (via Makefile).

  SharedDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: trainee-2026-niloy-mhp-deps
      ContentUri: ../layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # ── IAM Roles ────────────────────────────────────────────────────────────────

  # Ingress role: CloudWatch logs + Lambda invoke only (no DynamoDB)
  IngressExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trainee-2026-niloy-mhp-ingress-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: trainee-2026-niloy-mhp-ingress-invoke-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt MealFunction.Arn
                  - !GetAtt LocationFunction.Arn
                  - !GetAtt OverrideFunction.Arn
                  - !GetAtt HeadcountFunction.Arn
        - PolicyName: trainee-2026-niloy-mhp-ingress-dynamodb-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}

  # Feature role: DynamoDB + S3 (used by meal, location, override Lambdas)
  FeatureExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trainee-2026-niloy-mhp-feature-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: trainee-2026-niloy-mhp-feature-dynamodb-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*
        - PolicyName: trainee-2026-niloy-mhp-feature-s3-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}
                  - !Sub arn:aws:s3:::${S3BucketName}/*

  # Google Chat ingress role — DynamoDB + S3, no Lambda invoke needed (synchronous path)
  GoogleChatIngressExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trainee-2026-niloy-mhp-gchat-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: trainee-2026-niloy-mhp-gchat-dynamodb-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*
        - PolicyName: trainee-2026-niloy-mhp-gchat-s3-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}
                  - !Sub arn:aws:s3:::${S3BucketName}/*
        - PolicyName: trainee-2026-niloy-mhp-gchat-ssm-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mhp/gchat-sa-json

  # ── Single HTTP API Gateway ───────────────────────────────────────────────────

  BotApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: trainee-2026-niloy-mhp-api
      StageName: prod

  # ── Lambda Functions ──────────────────────────────────────────────────────────

  # Ingress: signature verification, auth, dispatch
  InteractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trainee-2026-niloy-mhp-ingress
      Handler: src.handlers.ingress.lambda_handler
      CodeUri: ../
      Role: !GetAtt IngressExecutionRole.Arn
      Environment:
        Variables:
          ROLE_ADMIN_ID: !Ref RoleAdminId
          ROLE_TEAM_LEAD_ID: !Ref RoleTeamLeadId
      Events:
        DiscordRoute:
          Type: HttpApi
          Properties:
            Path: /discord
            Method: POST
            ApiId: !Ref BotApi
    Metadata:
      BuildMethod: makefile

  # Feature Lambdas — invoked by IngressFunction; no direct API trigger
  MealFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trainee-2026-niloy-mhp-meal
      Handler: src.handlers.meal_handler.lambda_handler
      CodeUri: ../
      Role: !GetAtt FeatureExecutionRole.Arn
    Metadata:
      BuildMethod: makefile

  LocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trainee-2026-niloy-mhp-location
      Handler: src.handlers.location_handler.lambda_handler
      CodeUri: ../
      Role: !GetAtt FeatureExecutionRole.Arn
    Metadata:
      BuildMethod: makefile

  OverrideFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trainee-2026-niloy-mhp-override
      Handler: src.handlers.override_handler.lambda_handler
      CodeUri: ../
      Role: !GetAtt FeatureExecutionRole.Arn
    Metadata:
      BuildMethod: makefile

  HeadcountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trainee-2026-niloy-mhp-headcount
      Handler: src.handlers.headcount_handler.lambda_handler
      CodeUri: ../
      Role: !GetAtt FeatureExecutionRole.Arn
    Metadata:
      BuildMethod: makefile

  # Google Chat ingress Lambda
  GoogleChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trainee-2026-niloy-mhp-gchat-ingress
      Handler: src.handlers.google_chat_ingress.lambda_handler
      CodeUri: ../
      Role: !GetAtt GoogleChatIngressExecutionRole.Arn
      Environment:
        Variables:
          # Function-level Environment overrides Globals (not merge).
          # GOOGLE_CHAT_SERVICE_ACCOUNT_JSON removed — exceeds 4KB env limit.
          # Will use SSM Parameter Store when async posting is needed.
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          S3_BUCKET: !Ref S3BucketName
          CUTOFF_TIME: "21:00"
          WFH_MONTHLY_CAP: "5"
          FORWARD_PLANNING_DAYS: "7"
          TIMEZONE: "Asia/Dhaka"
          ENABLE_GOOGLE_CHAT: !Ref EnableGoogleChat
          GOOGLE_CHAT_AUDIENCE: !Ref GoogleChatAudience
          ROLE_ADMIN_ID: !Ref RoleAdminId
          ROLE_TEAM_LEAD_ID: !Ref RoleTeamLeadId
      Events:
        GoogleChatRoute:
          Type: HttpApi
          Properties:
            Path: /google-chat
            Method: POST
            ApiId: !Ref BotApi
    Metadata:
      BuildMethod: makefile

# Outputs
Outputs:
  BotApiEndpoint:
    Description: Base API URL — Discord uses /discord, Google Chat uses /google-chat
    Value: !Sub https://${BotApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name: !Sub ${AWS::StackName}-BotApiEndpoint

  InteractionFunctionArn:
    Description: Discord ingress Lambda ARN
    Value: !GetAtt InteractionFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-InteractionFunctionArn

  GoogleChatFunctionArn:
    Description: Google Chat ingress Lambda ARN
    Value: !GetAtt GoogleChatFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GoogleChatFunctionArn

  HeadcountFunctionArn:
    Description: Headcount summary Lambda ARN
    Value: !GetAtt HeadcountFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-HeadcountFunctionArn
